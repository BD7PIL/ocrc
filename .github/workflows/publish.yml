name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (Trusted Publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          test "v$V" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match package.json v$V"
            exit 1
          }
          echo "this version: $V"

      - name: This version must not be on the registry yet
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          if npm view "@bd7pil/ocrc@$V" version >/dev/null 2>&1; then
            echo "::error::@bd7pil/ocrc@$V already exists; bump package.json first"
            exit 1
          fi
          echo "registry does not have $V yet"

      - name: Verify (typecheck + tests + build)
        run: |
          npm run typecheck
          npm run typecheck:tests
          npm test
          npm run build

      - name: Assert the tarball ships the declared entry points
        run: |
          set -euo pipefail
          T="$(npm pack --silent | tail -1)"
          echo "tarball: $T"
          tar -tzf "$T" > /tmp/tar-list.txt
          for f in package/dist/index.js package/dist/index.d.ts package/dist/cli/index.js package/ops/components.json; do
            grep -qx "$f" /tmp/tar-list.txt || { echo "::error::missing $f"; exit 1; }
          done
          echo "tarball carries index + declarations + bin + component pins"

      - name: Publish
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          # A prerelease must never become `latest`: 2.0.0-alpha.N goes to `next`.
          case "$V" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          echo "publishing $V with dist-tag $TAG"
          npm publish --provenance --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: "" # Empty string prevents token auth, forces OIDC fallback
