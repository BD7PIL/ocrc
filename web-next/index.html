<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>
    // Apply the stored theme override before first paint (no FOUC). No
    // attribute = follow prefers-color-scheme (theme.css: dark base, light
    // via media query). Key kept in sync with the ui store (ocrc-theme) —
    // same key as the Svelte shell so the preference carries across shells.
    try {
      var t = localStorage.getItem('ocrc-theme')
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfdfd" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e10" />
  <meta name="apple-mobile-web-app-title" content="ocrc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ocrc</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
