name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (Trusted Publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install (plugin + web)
        run: |
          npm ci
          npm --prefix web ci

      - name: Verify (typecheck + tests + builds)
        run: |
          npm run typecheck
          npm test
          npm run build
          npm --prefix web run build
          npm --prefix web run test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: "" # Empty string prevents token auth, forces OIDC fallback
