name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install (plugin + web-next + extensions)
        run: |
          npm ci
          npm --prefix web-next ci
          npm --prefix extensions/ocrc-connect ci
          npm --prefix extensions/ocrc-omo-view ci

      - name: Typecheck (plugin)
        run: npm run typecheck

      - name: Test (plugin — unit + integration)
        run: npm test

      - name: Build (plugin)
        run: npm run build

      - name: Typecheck (web-next shell)
        run: npm --prefix web-next run typecheck

      - name: Build (web-next shell)
        run: npm --prefix web-next run build

      - name: Test (web-next shell)
        run: npm --prefix web-next run test

      - name: Typecheck + test + build (extensions)
        run: |
          npm --prefix extensions/ocrc-connect run typecheck
          npm --prefix extensions/ocrc-connect test
          npm --prefix extensions/ocrc-connect run build
          npm --prefix extensions/ocrc-omo-view run typecheck
          npm --prefix extensions/ocrc-omo-view test
          npm --prefix extensions/ocrc-omo-view run build
