name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        # 24 = 主线（本机开发机与对端实跑运行时都是 24：peer pin 是
        # node-v24.22.0）；20 = engines 地线兼容腿（package.json engines >=20），
        # 只跑单元测试，不锚覆盖率。
        node-version: [20, 24]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install (cli + extensions)
        run: |
          npm ci
          npm --prefix extensions/ocrc ci
          npm --prefix extensions/ocrc-omo-view ci

      - name: Lint (biome, lint-only — formatting is not enforced)
        run: npm run lint

      - name: Public docs links
        run: npm run check:links

      - name: Typecheck (cli)
        run: npm run typecheck

      - name: Typecheck (tests — the test tree is typechecked too)
        run: npm run typecheck:tests

      # `dist/` before the tests: a fresh clone has no dist until tsc runs.
      - name: Build (cli)
        run: npm run build

      - name: Test (cli)
        run: npm test

      # Coverage + hard floor on the main line (node 24) only — the numbers are
      # version-sensitive (v8 instrumentation differs across node lines) and the
      # baseline is anchored to what node 24 reports: the same line the dev
      # machine and the packaged peer runtime run, so local measurements and CI
      # agree. The floor leg (20) stays test-only.
      - name: Coverage gate (node 24)
        if: matrix.node-version == 24
        run: npm run test:coverage && npm run check:coverage

      - name: Typecheck + test + build (extensions)
        run: |
          npm --prefix extensions/ocrc run typecheck
          npm --prefix extensions/ocrc test
          npm --prefix extensions/ocrc run build
          npm --prefix extensions/ocrc-omo-view run typecheck
          npm --prefix extensions/ocrc-omo-view test
          npm --prefix extensions/ocrc-omo-view run build

      # The extensions' install artifacts (panel/ status/ service/ shared/) are
      # committed for zero-build folder installs — CI rebuilds from src and
      # fails if the committed shape drifted from source.
      - name: Extension dist consistency (staged artifacts match src)
        run: |
          git diff --exit-code -- extensions/ocrc/panel extensions/ocrc/status extensions/ocrc/service extensions/ocrc/shared
          git diff --exit-code -- extensions/ocrc-omo-view/panel extensions/ocrc-omo-view/service extensions/ocrc-omo-view/shared
          echo "extension artifacts in sync with src"

      # What a unit test cannot see: these bundles run inside a sandboxed frame
      # with no Node globals and no modals, and one shared guest layer copied
      # into two extensions. Pins the two defects that shipped from batch 2 and
      # the five-copies-of-theme.css drift.
      - name: Guest bundle invariants (no process.env, theme bridge, no prompts)
        run: node scripts/check-guest-bundles.mjs
