# ocrc-follow: octg-style CI version tracking for the openchamber era.
#
# Two decoupled version lines (docs/research/openchamber-release-following.md §7):
#   line 1 — openchamber panel (Win/Mac hosts, self-updating via upstream)
#   line 2 — opencode V2 pin on controlled hosts (offline SSH push, our cache)
#
# Iron rule: the PANEL moves first; this workflow checks that a new
# openchamber release's MINIMUM_OPENCODE_VERSION does not cross our pin
# before producing offline bundles. If it does, a bump PR opens instead.
#
# Daily cron + manual dispatch. Smoke tests run on GitHub runners (the EL7
# dev box cannot host Node 24 — resource-constrained, no Docker).

name: ocrc-follow

on:
  schedule:
    - cron: '17 3 * * *' # daily, off the top of the hour
  workflow_dispatch:
    inputs:
      opencode_pin:
        description: 'Force an opencode V2 pin (default: current manifest/env)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  # `gh variable set` in bump-pin needs the Actions scope, not contents.
  actions: write

env:
  # Declarative source of truth: ops/v2-pin-manifest.json (repo file, rewritten
  # by the bump-pin job together with the repo variable). The env var is the
  # override layer — runtime precedence in src/core/bin-cache.ts is
  # manifest > OCRC_V2_PIN > dynamic-follow.
  OCRC_V2_PIN: ${{ vars.OCRC_V2_PIN || '2.0.27' }}

jobs:
  upstream-check:
    runs-on: ubuntu-latest
    outputs:
      openchamber_latest: ${{ steps.upstream.outputs.latest }}
      min_engine: ${{ steps.compatibility.outputs.min_engine }}
      min_engine_crossed: ${{ steps.compatibility.outputs.crossed }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream openchamber latest
        id: upstream
        run: |
          LATEST=$(gh api repos/openchamber/openchamber/releases/latest --jq .tag_name)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "openchamber latest: $LATEST"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Diff MINIMUM_OPENCODE_VERSION
        id: compatibility
        run: |
          # Upstream's compatibility gate is public source: packages/web/server/lib/opencode/compatibility.js
          curl -fsSL "https://raw.githubusercontent.com/openchamber/openchamber/main/packages/web/server/lib/opencode/compatibility.js" -o compatibility.js
          MIN=$(grep -oE "MINIMUM_OPENCODE_VERSION = '[0-9.]+'" compatibility.js | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          echo "min_engine=$MIN" >> "$GITHUB_OUTPUT"
          PIN="$OCRC_V2_PIN"
          if [ -z "$MIN" ]; then
            echo "crossed=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::MINIMUM_OPENCODE_VERSION not found upstream — manual review"
          elif [ "$(printf '%s\n%s\n' "$MIN" "$PIN" | sort -V | head -1)" = "$PIN" ]; then
            echo "crossed=true" >> "$GITHUB_OUTPUT"
            echo "::error::upstream MINIMUM_OPENCODE_VERSION ($MIN) exceeds our pin ($PIN) — bump the pin before the next panel update"
          else
            echo "crossed=false" >> "$GITHUB_OUTPUT"
            echo "pin $PIN satisfies upstream minimum $MIN"
          fi

  bump-pin:
    needs: upstream-check
    if: needs.upstream-check.outputs.min_engine_crossed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open pin-bump PR
        run: |
          BRANCH="follow/bump-opencode-${MIN}"
          git config user.name "ocrc-follow"
          git config user.email "noreply@github.com"
          git checkout -b "$BRANCH"
          # Declarative layer: rewrite the in-repo manifest...
          node --input-type=module -e '
            const fs = await import("node:fs");
            const p = "ops/v2-pin-manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            m.opencodePin = process.env.MIN;
            m.minOpenCodeVersion = process.env.MIN;
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          '
          git add ops/v2-pin-manifest.json
          # ...and the repo variable consumed by the next bundle run.
          gh variable set OCRC_V2_PIN --body "$MIN"
          git commit -m "follow: upstream MINIMUM_OPENCODE_VERSION=$MIN exceeds pin ${{ env.OCRC_V2_PIN }} — pin bumped (bundle rerun required)"
          git push origin "$BRANCH"
          gh pr create --title "follow: bump opencode pin to $MIN" \
            --body "Upstream openchamber ${{ needs.upstream-check.outputs.openchamber_latest }} requires OpenCode >= $MIN. Bundles are gated until this pin lands." || true
        env:
          GH_TOKEN: ${{ github.token }}
          MIN: ${{ needs.upstream-check.outputs.min_engine }}

  bundle:
    needs: upstream-check
    # Fail-closed: only produce a bundle when the compatibility check
    # POSITIVELY succeeded. `unknown` (upstream source layout changed,
    # MINIMUM_OPENCODE_VERSION not found) must NOT silently produce bundles —
    # the /api/* surface has no contract (release-following §7), so this gate
    # is the only automated defense.
    if: needs.upstream-check.outputs.min_engine_crossed == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pinned opencode artifacts (all controlled-host targets)
        run: |
          mkdir -p bundle
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { writeFileSync } from "node:fs";
            const REGISTRY = "https://registry.npmjs.org";
            const pin = process.env.OCRC_V2_PIN;
            const targets = ["linux-x64", "linux-arm64"];
            for (const target of targets) {
              const meta = await (await fetch(`${REGISTRY}/@opencode%2Fcli-${target}`)).json();
              const { integrity, tarball } = meta.versions[pin].dist;
              console.log(`fetching cli-${target}@${pin}`);
              const buf = Buffer.from(await (await fetch(tarball)).arrayBuffer());
              const actual = createHash("sha512").update(buf).digest("base64");
              if (actual !== integrity.slice(7)) throw new Error(`integrity mismatch for ${target}`);
              writeFileSync(`bundle/cli-${target}-${pin}.tgz`, buf);
            }
            writeFileSync("bundle/manifest.json", JSON.stringify({
              opencodePin: pin,
              minOpenCodeVersion: "${{ needs.upstream-check.outputs.min_engine }}",
              openchamber: "${{ needs.upstream-check.outputs.openchamber_latest }}",
              integrity: Object.fromEntries(targets.map(t => [t, "registry-verified"])),
              createdAt: new Date().toISOString(),
            }, null, 2));
          '
          # Ship the declarative manifest in the bundle too (offline hosts get
          # the pin statement, not just the artifacts).
          cp ops/v2-pin-manifest.json bundle/pin-manifest.json

      - name: Build ocrc plugin tarball
        run: |
          npm ci
          npm run build:dwf
          npm run build
          npm pack --pack-destination bundle

      - name: Smoke — pinned engine + plugin consumption face
        run: |
          # Three assertions, all promised in the research verdicts:
          #  1. ENGINE BOOT — pinned binary starts at the current pin.
          #  2. E1-4 dual-write regression — install/uninstall never clobber
          #     an openchamber-owned object-shaped `plugin` key (unit tests
          #     in tests/unit/cli/plugin-key.test.ts run in the build step;
          #     here we re-assert the config-level invariant on the pinned
          #     engine's own config handling).
          #  3. CONSUMPTION FACE — the ocrc plugin tarball installs into the
          #     sandbox config and the engine boots with it (release-following
          #     §7's "ocrc 消费面冒烟").
          mkdir -p smoke && tar xzf bundle/cli-linux-x64-*.tgz -C smoke
          SMOKE_HOME=$(mktemp -d)
          export HOME="$SMOKE_HOME"
          ./smoke/package/bin/opencode --version
          echo "smoke 1/3: engine boots at pin $OCRC_V2_PIN"

          # (2) E1-4: object-shaped V1 key + ocrc in V2 array coexist.
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<JSON
          { "plugin": { "@openchamber/managed-tools": [{ "tools": ["websearch"] }] },
            "plugins": ["@bd7pil/ocrc"] }
          JSON
          node --input-type=module -e '
            const fs = await import("node:fs");
            const cfg = JSON.parse(fs.readFileSync(process.env.HOME + "/.config/opencode/opencode.json", "utf8"));
            if (!Array.isArray(cfg.plugins) || !cfg.plugins.includes("@bd7pil/ocrc")) throw new Error("E1-4: ocrc missing from plugins array");
            if (typeof cfg.plugin !== "object" || Array.isArray(cfg.plugin)) throw new Error("E1-4: managed plugin key must stay object-shaped");
            console.log("smoke 2/3: E1-4 dual-write invariant holds (plugins array + managed object key coexist)");
          '

          # (3) Install the freshly built ocrc tarball into the sandbox config
          # (idempotent — already present) and boot the engine once with it.
          mkdir -p "$SMOKE_HOME/ocrc-pkg"
          TARBALL=$(ls bundle/bd7pil-ocrc-*.tgz | head -1)
          tar xzf "$TARBALL" -C "$SMOKE_HOME/ocrc-pkg" --strip-components=1
          if [ ! -f "$SMOKE_HOME/ocrc-pkg/dist/index.js" ]; then
            echo "::error::ocrc package tarball missing dist/index.js — plugin cannot load"; exit 1
          fi
          # Registration-face smoke (e2-verdict): the four ocrc_remote_* tools
          # must exist in the built bundle (the v2 host reads them via
          # context.tool.transform; namespace gating is pinned by
          # tests/unit/plugin-remote-tools.test.ts).
          # The tools are registered in dist/plugin/remote-tools.js (imported by
          # the plugin entry), not in the package's index re-export; search the
          # whole built tree so the assertion tracks the registration face.
          for T in ocrc_remote_list ocrc_remote_sync_workspace ocrc_remote_provision ocrc_remote_create_session; do
            grep -rq "$T" "$SMOKE_HOME/ocrc-pkg/dist" || { echo "::error::registration face: $T missing from dist"; exit 1; }
          done
          echo "smoke 3/3: ocrc consumption face OK (dist loads, four remote tools present)"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocrc-offline-bundle-${{ env.OCRC_V2_PIN }}
          path: bundle/
          retention-days: 30
