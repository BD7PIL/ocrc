name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # GitHub Release notes
  id-token: write   # OIDC / provenance

concurrency:
  group: publish-ocrc-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (Trusted Publishing requires npm >= 11.5.1)
        run: npm install -g npm@11.5.1

      - name: Install
        run: npm ci

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          test "v$V" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match package.json v$V"
            exit 1
          }
          echo "this version: $V"

      - name: Check registry state (retry-safe)
        id: registry
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          if npm view "@bd7pil/ocrc@$V" version >/dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@bd7pil/ocrc@$V already exists — skipping npm publish, will still ensure the GitHub Release"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "registry does not have $V yet"
          fi

      - name: Verify (lint + typecheck + tests + build)
        run: |
          npm run lint
          npm run typecheck
          npm run typecheck:tests
          npm test
          npm run build

      - name: Assert the tarball ships the declared entry points
        run: |
          set -euo pipefail
          T="$(npm pack --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(Array.isArray(j)?j[0].filename:Object.values(j)[0].filename)})')"
          echo "tarball: $T"
          tar -tzf "$T" > /tmp/tar-list.txt
          for f in package/dist/index.js package/dist/index.d.ts package/dist/cli/index.js package/ops/components.json package/NOTICE; do
            grep -qx "$f" /tmp/tar-list.txt || { echo "::error::missing $f"; exit 1; }
          done
          echo "tarball carries index + declarations + bin + component pins + NOTICE"

      - name: Publish (retry-safe)
        if: steps.registry.outputs.published == 'true'
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          case "$V" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          for i in 1 2 3; do
            if npm publish --provenance --access public --tag "$TAG"; then exit 0; fi
            if npm view "@bd7pil/ocrc@$V" version >/dev/null 2>&1; then
              echo "publish landed despite the client error"
              exit 0
            fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "publish attempt $i failed; sleeping $((i * 15))s"
            sleep $((i * 15))
          done
        env:
          NODE_AUTH_TOKEN: "" # Empty string prevents token auth, forces OIDC fallback

      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          awk -v v="$V" '
            $0 ~ "^## " v "([ —-]|$)" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          # CHANGELOG 缺该版本小节时不再让发布链红掉：用占位 notes + warning（真修复是提交里带小节）
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no '## $V' section — release notes fell back to a link"
            {
              echo "ocrc $V"
              echo
              echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."
            } > /tmp/release-notes.md
          fi
          case "$V" in
            *-*) FLAGS="--prerelease" ;;
            *)   FLAGS="--latest" ;;
          esac
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v$V" -R "$GITHUB_REPOSITORY" $FLAGS --title "ocrc $V" --notes-file /tmp/release-notes.md
          else
            gh release create "v$V" -R "$GITHUB_REPOSITORY" \
              --verify-tag $FLAGS \
              --title "ocrc $V" --notes-file /tmp/release-notes.md
          fi
