# ocrc-follow: octg-style CI version tracking for the openchamber era.
#
# Two decoupled version lines (docs/research/openchamber-release-following.md §7):
#   line 1 — openchamber panel (Win/Mac hosts, self-updating via upstream)
#   line 2 — opencode V2 pin on controlled hosts (offline SSH push, our cache)
#
# Iron rule: the PANEL moves first; this workflow checks that a new
# openchamber release's MINIMUM_OPENCODE_VERSION does not cross our pin
# before producing offline bundles. If it does, a bump PR opens instead.
#
# Daily cron + manual dispatch. Smoke tests run on GitHub runners (the EL7
# dev box cannot host Node 24 — resource-constrained, no Docker).

name: ocrc-follow

on:
  schedule:
    - cron: '17 3 * * *' # daily, off the top of the hour
  workflow_dispatch:
    inputs:
      opencode_pin:
        description: 'Force an opencode V2 pin (default: current manifest/env)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  # `gh variable set` in bump-pin needs the Actions scope, not contents.
  actions: write

env:
  # Declarative source of truth: ops/v2-pin-manifest.json (repo file, rewritten
  # by the bump-pin job together with the repo variable). The env var is the
  # override layer — runtime precedence in src/core/bin-cache.ts is
  # manifest > OCRC_V2_PIN > dynamic-follow.
  OCRC_V2_PIN: ${{ vars.OCRC_V2_PIN || '2.0.27' }}

jobs:
  upstream-check:
    runs-on: ubuntu-latest
    outputs:
      openchamber_latest: ${{ steps.upstream.outputs.latest }}
      min_engine: ${{ steps.compatibility.outputs.min_engine }}
      min_engine_crossed: ${{ steps.compatibility.outputs.crossed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve upstream openchamber latest
        id: upstream
        run: |
          LATEST=$(gh api repos/openchamber/openchamber/releases/latest --jq .tag_name)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "openchamber latest: $LATEST"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Diff MINIMUM_OPENCODE_VERSION
        id: compatibility
        run: |
          # Upstream's compatibility gate is public source: packages/web/server/lib/opencode/compatibility.js
          curl -fsSL "https://raw.githubusercontent.com/openchamber/openchamber/main/packages/web/server/lib/opencode/compatibility.js" -o compatibility.js
          MIN=$(grep -oE "MINIMUM_OPENCODE_VERSION = '[0-9.]+'" compatibility.js | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          echo "min_engine=$MIN" >> "$GITHUB_OUTPUT"
          PIN="$OCRC_V2_PIN"
          if [ -z "$MIN" ]; then
            echo "crossed=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::MINIMUM_OPENCODE_VERSION not found upstream — manual review"
          elif [ "$(printf '%s\n%s\n' "$MIN" "$PIN" | sort -V | head -1)" = "$PIN" ]; then
            echo "crossed=true" >> "$GITHUB_OUTPUT"
            echo "::error::upstream MINIMUM_OPENCODE_VERSION ($MIN) exceeds our pin ($PIN) — bump the pin before the next panel update"
          else
            echo "crossed=false" >> "$GITHUB_OUTPUT"
            echo "pin $PIN satisfies upstream minimum $MIN"
          fi

  # D10: two upstream facts we depend on, checked on every run so we learn about
  # a change from CI rather than from a broken install. Neither is an error — the
  # whole point is to notice early and adapt (or drop our own workaround).
  upstream-asks:
    runs-on: ubuntu-latest
    steps:
      - name: Is uploadBundleOverSsh implemented yet?
        run: |
          # Our push path exists because upstream's managed mode installs on the
          # PEER (bun/npm + registry), which an air-gapped host cannot do, and its
          # `uploadBundleOverSsh` was declared but unimplemented. If that changes,
          # our provisioning layer becomes a convenience rather than a necessity.
          set +e
          body=$(curl -fsSL "https://raw.githubusercontent.com/openchamber/openchamber/main/packages/electron/ssh-manager.mjs" 2>/dev/null)
          code=$?
          if [ $code -ne 0 ]; then
            echo "::warning::could not fetch ssh-manager.mjs — upstream tracking skipped this run"
            exit 0
          fi
          if printf '%s' "$body" | grep -q 'uploadBundleOverSsh'; then
            if printf '%s' "$body" | grep -A 20 'uploadBundleOverSsh' | grep -qE 'not implemented|TODO|throw new Error'; then
              echo "uploadBundleOverSsh: still declared-but-unimplemented (our push path remains necessary)"
            else
              echo "::warning::uploadBundleOverSsh looks implemented upstream — re-evaluate our offline push layer (docs/handoff/rectification-plan-2026-10-17.md D10)"
            fi
          else
            echo "uploadBundleOverSsh: gone from upstream (check whether managed mode changed shape)"
          fi

      - name: Can the models.dev URL be overridden (our relay-only ask)?
        run: |
          # Experiment #4: the provider/model catalogue comes from the SERVER's
          # models.dev fetch, whose URL is hardcoded with no env override — so a
          # peer without egress needs the proxy on the *server*, and panel
          # terminals inherit it (experiment #6). An override would let us hang
          # the proxy on the engine only. We asked upstream for it; this check
          # tells us if it landed.
          set +e
          body=$(curl -fsSL "https://raw.githubusercontent.com/openchamber/openchamber/main/packages/web/server/lib/package-manager.js" 2>/dev/null) || true
          if [ -z "$body" ]; then
            echo "::warning::could not fetch package-manager.js — upstream tracking skipped this run"
            exit 0
          fi
          if printf '%s' "$body" | grep -qE 'MODELS_DEV_API_URL|MODELS_DEV_URL'; then
            echo "::warning::a models.dev URL symbol now exists upstream — check whether it is env-overridable (would let the proxy sit on the engine only)"
          else
            echo "models.dev URL: still hardcoded (relay-on-server remains our only option for offline peers)"
          fi

  bump-pin:
    needs: upstream-check
    if: needs.upstream-check.outputs.min_engine_crossed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Open pin-bump PR
        run: |
          BRANCH="follow/bump-opencode-${MIN}"
          git config user.name "ocrc-follow"
          git config user.email "noreply@github.com"
          git checkout -b "$BRANCH"
          # Declarative layer: rewrite the in-repo manifest...
          node --input-type=module -e '
            const fs = await import("node:fs");
            const p = "ops/v2-pin-manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            m.opencodePin = process.env.MIN;
            m.minOpenCodeVersion = process.env.MIN;
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          '
          git add ops/v2-pin-manifest.json
          # Idempotency: when the manifest already carries MIN (e.g. the bump
          # landed on main manually before this job ran), commit is a no-op —
          # treat "nothing to commit" as success, not a red run.
          if git diff --cached --quiet -- ops/v2-pin-manifest.json; then
            echo "::notice::manifest already at $MIN — nothing to bump"
            exit 0
          fi
          git commit -m "follow: upstream MINIMUM_OPENCODE_VERSION=$MIN exceeds pin ${{ env.OCRC_V2_PIN }} — pin bumped (bundle rerun required)"
          git push origin "$BRANCH"
          gh pr create --title "follow: bump opencode pin to $MIN" \
            --body "Upstream openchamber ${{ needs.upstream-check.outputs.openchamber_latest }} requires OpenCode >= $MIN. Bundles are gated until this pin lands." || true
          # Repo variable is the OVERRIDE layer only (runtime precedence:
          # manifest > OCRC_V2_PIN). GITHUB_TOKEN has been observed 403ing on
          # the Actions-variables API even with actions:write — the manifest
          # PR above is the authority, so a failed variable write must not
          # kill the bump (real incident: 3 days red, pin stuck at 2.1.4).
          gh variable set OCRC_V2_PIN --body "$MIN" \
            || echo "::warning::gh variable set failed (403) — manifest PR is authoritative; sync the variable manually"
        env:
          GH_TOKEN: ${{ github.token }}
          MIN: ${{ needs.upstream-check.outputs.min_engine }}

  bundle:
    needs: upstream-check
    # Fail-closed: only produce a bundle when the compatibility check
    # POSITIVELY succeeded. `unknown` (upstream source layout changed,
    # MINIMUM_OPENCODE_VERSION not found) must NOT silently produce bundles —
    # the /api/* surface has no contract (release-following §7), so this gate
    # is the only automated defense.
    if: needs.upstream-check.outputs.min_engine_crossed == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Fetch pinned opencode artifacts (all controlled-host targets)
        run: |
          mkdir -p bundle
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { writeFileSync } from "node:fs";
            const REGISTRY = "https://registry.npmjs.org";
            const pin = process.env.OCRC_V2_PIN;
            const targets = ["linux-x64", "linux-arm64"];
            const digests = {};
            for (const target of targets) {
              const meta = await (await fetch(`${REGISTRY}/@opencode%2Fcli-${target}`)).json();
              const { integrity, tarball } = meta.versions[pin].dist;
              console.log(`fetching cli-${target}@${pin}`);
              const buf = Buffer.from(await (await fetch(tarball)).arrayBuffer());
              const actual = createHash("sha512").update(buf).digest("base64");
              if (actual !== integrity.slice(7)) throw new Error(`integrity mismatch for ${target}`);
              writeFileSync(`bundle/cli-${target}-${pin}.tgz`, buf);
              // The consumer (bin-cache.takeBundleArtifact) refuses a bundle file
              // it cannot verify, so the digests have to be in the manifest —
              // without them the bundle is dead weight on the control side.
              digests[target] = {
                sha512: `sha512-${actual}`,
                sha256: createHash("sha256").update(buf).digest("hex"),
                bytes: buf.length,
              };
            }
            writeFileSync("bundle/manifest.json", JSON.stringify({
              opencodePin: pin,
              minOpenCodeVersion: "${{ needs.upstream-check.outputs.min_engine }}",
              openchamber: "${{ needs.upstream-check.outputs.openchamber_latest }}",
              integrity: Object.fromEntries(targets.map(t => [t, "registry-verified"])),
              digests,
              createdAt: new Date().toISOString(),
            }, null, 2));
          '
          # Ship the declarative manifest in the bundle too (offline hosts get
          # the pin statement, not just the artifacts).
          cp ops/v2-pin-manifest.json bundle/pin-manifest.json

      - name: Build ocrc CLI tarball
        run: |
          npm ci
          npm run build
          npm pack --pack-destination bundle

      - name: Smoke — pinned engine boots and the CLI tarball is complete
        run: |
          # The engine half of the promise: the pinned binary starts.
          mkdir -p smoke && tar xzf bundle/cli-linux-x64-*.tgz -C smoke
          ./smoke/package/bin/opencode --version
          echo "smoke 1/2: engine boots at pin $OCRC_V2_PIN"

          # The CLI half: what npm would publish actually contains the entry
          # point and the declarations the `exports.types` claim points at.
          TARBALL=$(ls bundle/bd7pil-ocrc-*.tgz | head -1)
          mkdir -p smoke-ocrc && tar xzf "$TARBALL" -C smoke-ocrc --strip-components=1
          for f in dist/index.js dist/index.d.ts dist/cli/index.js; do
            [ -f "smoke-ocrc/$f" ] || { echo "::error::ocrc tarball missing $f"; exit 1; }
          done
          echo "smoke 2/2: CLI tarball complete (index + declarations + bin)"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ocrc-offline-bundle-${{ env.OCRC_V2_PIN }}
          path: bundle/
          retention-days: 7
