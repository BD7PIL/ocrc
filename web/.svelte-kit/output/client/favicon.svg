<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- ocrc "enso" mark on a paper tile. Inline media query switches the
       palette with the browser's color scheme (light values by default). -->
  <style>
    .tile { fill: #faf9f6; }
    .ring { stroke: #1c1b18; }
    .dot  { fill: #e4580f; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #0d0d0d; }
      .ring { stroke: #f5f4f0; }
      .dot  { fill: #fb8b3c; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14"/>
  <path class="ring" d="M46 15 A24 24 0 1 0 54 32" fill="none" stroke-width="8" stroke-linecap="round"/>
  <circle class="dot" cx="49" cy="20" r="6"/>
</svg>
