<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>
    // Apply the stored theme override before first paint (no FOUC). No
    // attribute = follow prefers-color-scheme (theme.css: dark base, light
    // via media query). Keep the key in sync with stores/ui.ts (ocrc-theme).
    try {
      var t = localStorage.getItem('ocrc-theme')
      // 'auto' (or nothing) = follow prefers-color-scheme — no attribute.
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg?v=2" />
  <link rel="icon" href="%sveltekit.assets%/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f6" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
  <meta name="apple-mobile-web-app-title" content="ocrc" />
  <!-- iOS standalone PWA: fullscreen + translucent status bar (content padded via safe-area insets) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
