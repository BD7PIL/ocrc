# ocrc-pack — build and publish the two Linux x64 app packs.
#
# A pack is the whole `@openchamber/web` prefix, built once per openchamber
# release. `modern` keeps the official node-pty prebuild; `legacy-glibc217`
# replaces it with a rebuild against glibc 2.17 and pairs with the glibc-217
# Node runtime the control side already pushes.
#
# The control side prefers a verified pack (ensureAppPack) and only falls back
# to the Windows cross-install when no pack is available.
#
# Build identity = the release tag `ocrc-openchamber-pack-<version>`. `detect` stops
# the whole chain as soon as that release already carries its assets, so a
# version is built exactly once and a published pack is never silently replaced
# (no unconditional `--clobber` on a complete release). The daily cron is
# therefore a cheap existence check on days upstream did not release anything.
# To rebuild a published version on purpose, delete its release first — the gate
# then sees it as missing and rebuilds it.
#
# Retention (see the `cleanup` job):
#   - intermediate pack artifacts: 3 days (long enough to re-run a failed publish)
#   - runs of this workflow: newest 30, the rest deleted (daily cron adds up)
#   - pack releases: pruned past 90 days, EXCEPT the version pinned by
#     DEFAULT_APP_VERSION in src/core/remote-instance.ts. A pruned version is
#     rebuildable on demand, and the frozen lock file shipped next to each pack
#     makes that rebuild byte-identical.

name: ocrc-pack

on:
  workflow_dispatch:
    inputs:
      openchamber_version:
        description: 'openchamber version to pack (without leading v; empty = latest release)'
        required: false
        default: ''
      publish:
        description: 'publish the packs as a GitHub release'
        type: boolean
        default: true
  schedule:
    - cron: '23 4 * * *' # daily, off the top of the hour

permissions:
  contents: write
  # the cleanup job prunes this workflow's own old runs
  actions: write

env:
  NODE_VERSION: '24.22.0'
  NODE_GLIBC217_TARBALL: 'node-v24.22.0-linux-x64-glibc-217.tar.xz'
  RELEASE_RETENTION_DAYS: '90'
  KEEP_RUNS: '30'

jobs:
  # ===========================================================================
  # 1. Resolve the version, then stop everything if it is already published
  # ===========================================================================
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - id: version
        name: Resolve the openchamber version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.openchamber_version }}
        run: |
          V="${INPUT_VERSION}"
          if [ -z "$V" ]; then
            V="$(gh api repos/openchamber/openchamber/releases/latest --jq .tag_name | sed 's/^v//')"
          fi
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=ocrc-openchamber-pack-$V" >> "$GITHUB_OUTPUT"
          echo "packing openchamber $V"

      - id: gate
        name: Skip when this version has already been built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          V: ${{ steps.version.outputs.version }}
        run: |
          # The 7 core assets a complete release carries. The per-tier
          # `.lock.json` files introduced on 2026-10-17 are deliberately NOT
          # required: a release published before them must not be judged
          # incomplete, or the first scheduled run would rebuild and replace a
          # pack that has already passed acceptance on both targets.
          expected() {
            for tier in modern legacy-glibc217; do
              echo "ocrc-openchamber-pack-${V}-linux-x64-${tier}.tar.gz"
              echo "ocrc-openchamber-pack-${V}-linux-x64-${tier}.tar.gz.sha512"
              echo "ocrc-openchamber-pack-${V}-linux-x64-${tier}.json"
            done
            echo "ocrc-openchamber-pack-manifest.json"
          }

          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' > assets.txt 2>/dev/null; then
            echo "$TAG is not published yet — building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=""
          while read -r name; do
            grep -qxF "$name" assets.txt || missing="$missing $name"
          done < <(expected)

          if [ -n "$missing" ]; then
            echo "$TAG exists but is incomplete, missing:$missing — rebuilding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG already carries all 7 core assets — nothing to build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================================
  # 2. Build openchamber pack (official node-pty prebuild)
  # ===========================================================================
  pack-modern:
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: >-
          node scripts/build-app-pack.mjs
          --version "${{ needs.detect.outputs.version }}"
          --tier modern --out pack
      - uses: actions/upload-artifact@v4
        with:
          name: ocrc-openchamber-pack-modern
          path: pack/*
          if-no-files-found: error
          retention-days: 3

  # ===========================================================================
  # 3. Build legacy pack (node-pty rebuilt for glibc 2.17)
  # ===========================================================================
  pack-legacy:
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    # NOT `container: centos:7`: GitHub now runs JS actions with its own Node 24,
    # which needs glibc >= 2.27, so actions/checkout itself dies inside a
    # glibc-2.17 image. Check out on the host and drive a centos:7 build with
    # `docker run`, so the only thing inside the old glibc is our own script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the legacy pack inside centos:7
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e VERSION -e NODE_VERSION -e NODE_GLIBC217_TARBALL \
            centos:7 bash -lc '
              set -euo pipefail
              # CentOS 7 is EOL: vault for the base repos, SCLo written by hand.
              sed -i "s|^mirrorlist=|#mirrorlist=|g; s|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-*.repo
              printf "%s\n" \
                "[centos-sclo-rh]" \
                "name=CentOS-7 - SCLo rh" \
                "baseurl=http://vault.centos.org/7.9.2009/sclo/x86_64/rh/" \
                "gpgcheck=0" \
                "enabled=1" > /etc/yum.repos.d/CentOS-SCLo.repo
              yum install -y tar xz curl ca-certificates binutils \
                devtoolset-11-gcc devtoolset-11-gcc-c++ devtoolset-11-make \
                rh-python38-python rh-python38-python-devel
              curl -fsSLO "https://unofficial-builds.nodejs.org/download/release/v${NODE_VERSION}/${NODE_GLIBC217_TARBALL}"
              tar xf "$NODE_GLIBC217_TARBALL"
              mv "node-v${NODE_VERSION}-linux-x64-glibc-217" /opt/node
              export PATH=/opt/node/bin:$PATH
              /opt/node/bin/node -v
              /opt/node/bin/node /opt/node/lib/node_modules/npm/bin/npm-cli.js -v
              node scripts/build-app-pack.mjs \
                --version "$VERSION" --tier legacy-glibc217 --out pack \
                --node /opt/node/bin/node --node-dir /opt/node
            '
      - uses: actions/upload-artifact@v4
        with:
          name: ocrc-openchamber-pack-legacy
          path: pack/*
          if-no-files-found: error
          retention-days: 3

  # ===========================================================================
  # 4. Publish the release assets
  # ===========================================================================
  publish:
    needs: [detect, pack-modern, pack-legacy]
    # Reached only for a missing or incomplete release: `detect` blocks a
    # version whose release is already complete, so `--clobber` below can only
    # ever repair, never replace a pack that passed acceptance.
    if: needs.detect.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ocrc-openchamber-pack-*
          path: pack
          merge-multiple: true
      - name: Merge tier manifests
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const TIERS = ['modern', 'legacy-glibc217']
          const tiers = {}
          let version = process.env.VERSION
          for (const f of fs.readdirSync('pack').filter((f) => f.endsWith('.json'))) {
            const j = JSON.parse(fs.readFileSync(`pack/${f}`, 'utf8'))
            // Skip the per-tier `.lock.json` files: they are lock files, not
            // manifests, and their lack of a `tier` is what tells them apart.
            if (!TIERS.includes(j.tier)) continue
            version = j.openchamberVersion || version
            tiers[j.tier] = {
              asset: j.asset,
              sha512Base64: j.sha512Base64,
              sha512Hex: j.sha512Hex,
              glibcFloor: j.glibcFloor,
              ...(j.lockAsset ? { lockAsset: j.lockAsset, lockSha512Hex: j.lockSha512Hex } : {}),
            }
          }
          for (const t of TIERS) if (!tiers[t]) throw new Error(`tier manifest missing: ${t}`)
          fs.writeFileSync('pack/ocrc-openchamber-pack-manifest.json', JSON.stringify({ openchamberVersion: version, tiers }, null, 2) + '\n')
          console.log('manifest', version, Object.keys(tiers))
          NODE
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          # This job has no checkout, so `gh` cannot infer the repo from git.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "repairing the incomplete release $TAG"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "OCRC openchamber pack ${TAG#ocrc-openchamber-pack-}" --latest=false \
              --notes "App packs for openchamber ${TAG#ocrc-openchamber-pack-} (Linux x64; modern + legacy glibc 2.17). Changelog: https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md"
          fi
          gh release upload "$TAG" pack/* -R "$GITHUB_REPOSITORY" --clobber

  # ===========================================================================
  # 5. Retention: prune old runs, then old pack releases
  # ===========================================================================
  cleanup:
    needs: [detect]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Prune old runs of this workflow
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const keep = Number(process.env.KEEP_RUNS || 30)
            const res = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ocrc-pack.yml',
              status: 'completed',
              per_page: 100,
            })
            const stale = res.data.workflow_runs.slice(keep)
            for (const run of stale) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              })
            }
            console.log(`deleted ${stale.length} old runs, kept the newest ${keep}`)

      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - name: Prune pack releases past retention (never the pinned version)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PIN="$(grep -oP "DEFAULT_APP_VERSION = '\K[^']+" src/core/remote-instance.ts)"
          test -n "$PIN"
          echo "retention ${RELEASE_RETENTION_DAYS}d; ocrc-openchamber-pack-${PIN} is exempt (DEFAULT_APP_VERSION)"
          cutoff="$(date -u -d "${RELEASE_RETENTION_DAYS} days ago" +%s)"
          gh release list -R "$GITHUB_REPOSITORY" -L 200 \
            --json tagName,createdAt --jq '.[] | "\(.createdAt) \(.tagName)"' > releases.txt
          while read -r created tag; do
            case "$tag" in ocrc-openchamber-pack-*) ;; *) continue ;; esac
            if [ "$tag" = "ocrc-openchamber-pack-${PIN}" ]; then
              echo "keep $tag (pinned)"
              continue
            fi
            [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ] || continue
            echo "prune $tag (created $created)"
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < releases.txt
