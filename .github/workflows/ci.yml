name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install (plugin + extensions)
        run: |
          npm ci
          npm --prefix extensions/ocrc-remote ci
          npm --prefix extensions/ocrc-omo-view ci

      - name: Typecheck (plugin)
        run: npm run typecheck

      - name: Typecheck (tests — the test tree is typechecked too)
        run: npm run typecheck:tests

      - name: Test (plugin — unit)
        run: npm test

      - name: Test (plugin — integration, fake bot)
        run: npm run test:integration

      - name: Build (plugin)
        run: npm run build

      - name: Coverage (plugin, baseline report)
        if: matrix.node-version == 22
        run: |
          npx vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary
          npx vitest run --coverage --coverage.reporter=text-summary 2>/dev/null | tail -20 || true

      - name: Typecheck + test + build (extensions)
        run: |
          npm --prefix extensions/ocrc-remote run typecheck
          npm --prefix extensions/ocrc-remote test
          npm --prefix extensions/ocrc-remote run build
          npm --prefix extensions/ocrc-omo-view run typecheck
          npm --prefix extensions/ocrc-omo-view test
          npm --prefix extensions/ocrc-omo-view run build

      # The extensions' install artifacts (panel/ status/ service/ shared/) are
      # committed for zero-build folder installs — CI rebuilds from src and
      # fails if the committed shape drifted from source.
      - name: Extension dist consistency (staged artifacts match src)
        run: |
          git diff --exit-code -- extensions/ocrc-remote/panel extensions/ocrc-remote/status extensions/ocrc-remote/service extensions/ocrc-remote/shared
          git diff --exit-code -- extensions/ocrc-omo-view/panel extensions/ocrc-omo-view/service extensions/ocrc-omo-view/shared
          echo "extension artifacts in sync with src"

      # What a unit test cannot see: these bundles run inside a sandboxed frame
      # with no Node globals and no modals, and one shared guest layer copied
      # into two extensions. Pins the two defects that shipped from batch 2 and
      # the five-copies-of-theme.css drift.
      - name: Guest bundle invariants (no process.env, theme bridge, no prompts)
        run: node scripts/check-guest-bundles.mjs

      # Windows-handoff artifact: both extensions at their install shape,
      # packed for the panel's folder install (batch6 handoff §2).
      - name: Pack ocrc-extensions tarball
        run: |
          mkdir -p pack
          cp -r extensions/ocrc-remote extensions/ocrc-omo-view pack/
          rm -rf pack/*/src pack/*/node_modules pack/*/dist pack/*/tests
          tar czf ocrc-extensions-${{ github.sha }}.tar.gz -C pack ocrc-remote ocrc-omo-view

      - name: Upload extension pack
        uses: actions/upload-artifact@v4
        with:
          name: ocrc-extensions-${{ github.sha }}
          path: ocrc-extensions-${{ github.sha }}.tar.gz
          retention-days: 30
